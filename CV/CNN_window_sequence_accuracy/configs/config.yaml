dataset:
  hf_repo: mrmrx/CADS-dataset
  subsets: [0003_kits21, 0004_lits]
  seg_parts: [551]
  subset_labels:
    0003_kits21: [2, 3]  # right/left kidney
    0004_lits: [5]       # liver
  n_volumes: 300
  n_synthetic: 12
  split: [0.7, 0.15, 0.15]
  seed: 42
  split_seed: 2026
  use_synthetic: false

preprocess:
  target_shape: [64, 128, 128]
  hu_window: [-160, 240]
  slice_positive_thresh: 10
  min_component_voxels: 200
  min_box_size: 5

baseline:
  backbone: resnet18
  pretrained: true
  batch_size: 32
  epochs: 8
  lr: 0.001
  weight_decay: 0.0001
  patience: 3

window:
  percentile: 95
  stride: 1
  feature_batch_size: 32
  train_batch_size: 64
  hidden_size: 128
  epochs: 20
  lr: 0.001
  weight_decay: 0.0001
  patience: 5
  threshold_metric: balanced_accuracy
  bootstrap_repeats: 500
  models: [window_linear, lstm_uni_1, lstm_uni_2, lstm_bi_1, lstm_bi_2]

runtime:
  device: auto
  num_workers: 0

artifacts:
  split_manifest: results/cohort_split.json
  window_spec: results/window_q95.json
  baseline_checkpoint: checkpoints/slice_baseline.pt
  embedding_cache: cache/embeddings
  temporal_checkpoints: checkpoints/temporal
  comparison: results/window_comparison.json
